<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tipos Vivos — a página que vira desenho</title>
<style>
:root{ --bg:#0a0908; --ink:#f0e6d2; --dim:#7d7263; --accent:#c8a04a; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace}
#stage{position:relative;width:100vw;height:100vh;cursor:crosshair}
canvas{position:absolute;inset:0;width:100%;height:100%}

#top{position:absolute;top:0;left:0;right:0;z-index:4;pointer-events:none;
  padding:clamp(14px,2.2vw,28px) clamp(16px,3vw,40px) clamp(30px,4vw,52px);
  display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
  background:linear-gradient(to bottom,rgba(10,9,8,.94) 0%,rgba(10,9,8,.78) 45%,rgba(10,9,8,0) 100%)}
#meta{font-size:clamp(8px,.92vw,11px);letter-spacing:.2em;text-transform:uppercase;line-height:2}
#meta b{color:var(--accent);font-weight:400}
#meta span{color:var(--dim);display:block}

#ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;pointer-events:auto}
button{background:none;border:1px solid #2b2620;color:var(--dim);font:inherit;
  font-size:clamp(8px,.9vw,10px);letter-spacing:.16em;text-transform:uppercase;
  padding:.55em .85em;cursor:pointer;transition:.16s;white-space:nowrap}
button:hover{color:var(--ink);border-color:#544c40}
button.on{color:var(--accent);border-color:var(--accent)}

#foot{position:absolute;bottom:0;left:0;right:0;z-index:4;pointer-events:none;
  padding:clamp(28px,4vw,48px) clamp(16px,3vw,40px) clamp(12px,2vw,26px);
  display:flex;justify-content:space-between;align-items:flex-end;gap:20px;
  font-size:clamp(8px,.9vw,10px);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(to top,rgba(10,9,8,.94) 0%,rgba(10,9,8,.78) 45%,rgba(10,9,8,0) 100%)}
#hint{animation:p 3s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.25}50%{opacity:.75}}
#boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:9;background:#0a0908;color:var(--dim);font-size:11px;letter-spacing:.24em;
  text-transform:uppercase;transition:opacity .5s}
input[type=file]{display:none}

/* toque: alvos maiores e sem cursor de mira */
@media (hover:none){
  #stage{cursor:default}
  button{font-size:11px;padding:.75em 1.05em;letter-spacing:.12em}
  #ctl{gap:8px}
  #top{padding-bottom:clamp(36px,7vw,60px)}
  #meta{font-size:10px}
  #foot{font-size:9px}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="top">
    <div id="meta"><b id="mTitle"></b><span id="mSrc"></span></div>
    <div id="ctl">
      <button id="bWork">trocar obra</button>
      <button id="bPage">ver a página</button>
      <button id="bLens">lente: linha</button>
      <button id="bCols" class="on">colunas: 2</button>
      <button id="bMode">modo: mancha</button>
      <button id="bGrain" class="on">grão: fino</button>
      <button id="bPost">tons: 4</button>
      <button id="bHole" class="on">recorte: on</button>
      <button id="bImg">carregar desenho</button>
      <input type="file" id="file" accept="image/*">
    </div>
  </div>

  <div id="foot">
    <span id="hint">mova o mouse sobre o desenho para ler</span>
    <span id="stats"></span>
  </div>

  <div id="boot">compondo a página…</div>
</div>

/* ==================================================================
   TIPOS VIVOS
   Cada letra tem duas coordenadas — a tipográfica e a pictórica — e um
   escalar r ∈ [0,1] que diz onde ela está entre as duas. O cursor não
   move nada: só redefine r.

     A. CORPUS      texto em domínio público + arte-alvo
     B. LAYOUT      texto → glifos com posição tipográfica
     C. DENSIDADE   arte → mapa de escuridão + campo de ângulos
     D. PAREAMENTO  glifo (por densidade de tinta) ↔ ponto (por escuridão)
     E. LENTE       distância medida na PÁGINA, nunca no desenho
     F. ATLAS       glifos pré-rasterizados em 16 rotações
   ================================================================== */

  title:'Ishmael — Moby Dick',
  src:'Herman Melville, 1851 · domínio público · cap. I e epílogo',
  text:`Call me Ishmael. Some years ago — never mind how long precisely — having little or no money in my purse, and nothing particular to interest me on shore, I thought I would sail about a little and see the watery part of the world. It is a way I have of driving off the spleen and regulating the circulation. Whenever I find myself growing grim about the mouth; whenever it is a damp, drizzly November in my soul; whenever I find myself involuntarily pausing before coffin warehouses, and bringing up the rear of every funeral I meet; and especially whenever my hypos get such an upper hand of me, that it requires a strong moral principle to prevent me from deliberately stepping into the street, and methodically knocking people's hats off — then, I account it high time to get to sea as soon as I can. This is my substitute for pistol and ball. With a philosophical flourish Cato throws himself upon his sword; I quietly take to the ship. There is nothing surprising in this. If they but knew it, almost all men in their degree, some time or other, cherish very nearly the same feelings towards the ocean with me.

There now is your insular city of the Manhattoes, belted round by wharves as Indian isles by coral reefs — commerce surrounds it with her surf. Right and left, the streets take you waterward. Look at the crowds of water-gazers there. Circumambulate the city of a dreamy Sabbath afternoon. What do you see? Posted like silent sentinels all around the town, stand thousands upon thousands of mortal men fixed in ocean reveries. Some leaning against the spiles; some seated upon the pier-heads; some looking over the bulwarks of ships from China; some high aloft in the rigging, as if striving to get a still better seaward peep. But these are all landsmen; of week days pent up in lath and plaster, tied to counters, nailed to benches, clinched to desks. How then is this? Are the green fields gone? What do they here?

Why is almost every robust healthy boy with a robust healthy soul in him, at some time or other crazy to go to sea? Why upon your first voyage as a passenger, did you yourself feel such a mystical vibration, when first told that you and your ship were now out of sight of land? Surely all this is not without meaning. And still deeper the meaning of that story of Narcissus, who because he could not grasp the tormenting, mild image he saw in the fountain, plunged into it and was drowned. But that same image, we ourselves see in all rivers and oceans. It is the image of the ungraspable phantom of life; and this is the key to it all.

The drama's done. Why then here does any one step forth? Because one did survive the wreck. It so chanced, that after the Parsee's disappearance, I was he whom the Fates ordained to take the place of Ahab's bowsman. Buoyed up by that coffin, for almost one whole day and night, I floated on a soft and dirge-like main. The unharming sharks, they glided by as if with padlocks on their mouths; the savage sea-hawks sailed with sheathed beaks. On the second day, a sail drew near, nearer, and picked me up at last. It was the devious-cruising Rachel, that in her retracing search after her missing children, only found another orphan.`

  src:'Lewis Carroll, 1865 - dominio publico - cap. VI',
  text:`She was a little startled by seeing the Cheshire Cat sitting on a bough of a tree a few yards off. The Cat only grinned when it saw Alice. It looked good-natured, she thought: still it had very long claws and a great many teeth, so she felt that it ought to be treated with respect.

'Cheshire Puss,' she began, rather timidly, as she did not at all know whether it would like the name: however, it only grinned a little wider. 'Come, it's pleased so far,' thought Alice, and she went on. 'Would you tell me, please, which way I ought to go from here?'

'That depends a good deal on where you want to get to,' said the Cat. 'I don't much care where,' said Alice. 'Then it doesn't matter which way you go,' said the Cat. 'So long as I get somewhere,' Alice added as an explanation. 'Oh, you're sure to do that,' said the Cat, 'if you only walk long enough.'

Alice felt that this could not be denied, so she tried another question. 'What sort of people live about here?' 'In that direction,' the Cat said, waving its right paw round, 'lives a Hatter: and in that direction, lives a March Hare. Visit either you like: they're both mad.' 'But I don't want to go among mad people,' Alice remarked. 'Oh, you can't help that,' said the Cat: 'we're all mad here. I'm mad. You're mad.' 'How do you know I'm mad?' said Alice. 'You must be,' said the Cat, 'or you wouldn't have come here.'

Alice didn't think that proved it at all; however, she went on. 'And how do you know that you're mad?' 'To begin with,' said the Cat, 'a dog's not mad. You grant that?' 'I suppose so,' said Alice. 'Well, then,' the Cat went on, 'you see, a dog growls when it's angry, and wags its tail when it's pleased. Now I growl when I'm pleased, and wag my tail when I'm angry. Therefore I'm mad.' 'I call it purring, not growling,' said Alice. 'Call it what you like,' said the Cat.

'By-the-bye, what became of the baby? I'd nearly forgotten to ask.' 'It turned into a pig,' Alice quietly said, just as if it had come back in a natural way. 'I thought it would,' said the Cat, and vanished again. Alice waited a little, half expecting to see it once more, but it did not appear, and after a minute or two she walked on in the direction in which the March Hare was said to live.

{
  id:'prospero', img:'mago',
  title:'Próspero — A Tempestade',
  src:'William Shakespeare, 1611 · domínio público · I.ii, II.ii, III.ii, IV.i, V.i e epílogo',
  text:`Our revels now are ended. These our actors, as I foretold you, were all spirits and are melted into air, into thin air: and, like the baseless fabric of this vision, the cloud-capp'd towers, the gorgeous palaces, the solemn temples, the great globe itself, yea, all which it inherit, shall dissolve and, like this insubstantial pageant faded, leave not a rack behind. We are such stuff as dreams are made on, and our little life is rounded with a sleep.

In few, they hurried us aboard a bark, bore us some leagues to sea; where they prepared a rotten carcass of a boat, not rigg'd, nor tackle, sail, nor mast; the very rats instinctively had quit it: there they hoist us, to cry to the sea that roar'd to us, to sigh to the winds whose pity, sighing back again, did us but loving wrong. There they hoist us, and there we were, upon the sea, and the sea was all the world we had.

Be not afeard; the isle is full of noises, sounds and sweet airs, that give delight and hurt not. Sometimes a thousand twangling instruments will hum about mine ears, and sometime voices that, if I then had waked after long sleep, will make me sleep again: and then, in dreaming, the clouds methought would open and show riches ready to drop upon me that, when I waked, I cried to dream again.

Full fathom five thy father lies; of his bones are coral made; those are pearls that were his eyes: nothing of him that doth fade, but doth suffer a sea-change into something rich and strange. Sea-nymphs hourly ring his knell: ding-dong. Hark! now I hear them — ding-dong, bell.

Come unto these yellow sands, and then take hands: curtsied when you have and kiss'd the wild waves whist, foot it featly here and there; and, sweet sprites, the burthen bear. Where the bee sucks, there suck I: in a cowslip's bell I lie; there I couch when owls do cry. On the bat's back I do fly after summer merrily. Merrily, merrily shall I live now under the blossom that hangs on the bough.

Ye elves of hills, brooks, standing lakes and groves, and ye that on the sands with printless foot do chase the ebbing Neptune and do fly him when he comes back; you demi-puppets that by moonshine do the green sour ringlets make, whereof the ewe not bites; and you whose pastime is to make midnight mushrooms, that rejoice to hear the solemn curfew; by whose aid, weak masters though ye be, I have bedimm'd the noontide sun, call'd forth the mutinous winds, and 'twixt the green sea and the azured vault set roaring war: to the dread rattling thunder have I given fire and rifted Jove's stout oak with his own bolt; the strong-based promontory have I made shake and by the spurs pluck'd up the pine and cedar: graves at my command have waked their sleepers, oped, and let 'em forth by my so potent art. But this rough magic I here abjure, and, when I have required some heavenly music, which even now I do, to work mine end upon their senses that this airy charm is for, I'll break my staff, bury it certain fathoms in the earth, and deeper than did ever plummet sound I'll drown my book.

Now my charms are all o'erthrown, and what strength I have's mine own, which is most faint: now, 'tis true, I must be here confined by you, or sent to Naples. Let me not, since I have my dukedom got and pardon'd the deceiver, dwell in this bare island by your spell; but release me from my bands with the help of your good hands: gentle breath of yours my sails must fill, or else my project fails, which was to please. Now I want spirits to enforce, art to enchant, and my ending is despair, unless I be relieved by prayer, which pierces so that it assaults mercy itself and frees all faults. As you from crimes would pardon'd be, let your indulgence set me free.`

{
  id:'telltale', img:'olhos',
  title:'The Vulture Eye — The Tell-Tale Heart',
  src:'Edgar Allan Poe, 1843 · domínio público',
  text:`True! — nervous — very, very dreadfully nervous I had been and am; but why will you say that I am mad? The disease had sharpened my senses — not destroyed — not dulled them. Above all was the sense of hearing acute. I heard all things in the heaven and in the earth. I heard many things in hell. How, then, am I mad? Hearken! and observe how healthily — how calmly I can tell you the whole story.

It is impossible to say how first the idea entered my brain; but once conceived, it haunted me day and night. Object there was none. Passion there was none. I loved the old man. He had never wronged me. He had never given me insult. For his gold I had no desire. I think it was his eye! yes, it was this! He had the eye of a vulture — a pale blue eye, with a film over it. Whenever it fell upon me my blood ran cold; and so by degrees — very gradually — I made up my mind to take the life of the old man, and thus rid myself of the eye for ever.

Now this is the point. You fancy me mad. Madmen know nothing. But you should have seen me. You should have seen how wisely I proceeded — with what caution — with what foresight — with what dissimulation I went to work! I was never kinder to the old man than during the whole week before I killed him. And every night, about midnight, I turned the latch of his door and opened it — oh, so gently! And then, when I had made an opening sufficient for my head, I put in a dark lantern, all closed, closed, so that no light shone out, and then I thrust in my head. Oh, you would have laughed to see how cunningly I thrust it in! I moved it slowly — very, very slowly, so that I might not disturb the old man's sleep.

When I had waited a long time, very patiently, without hearing him lie down, I resolved to open a little — a very, very little crevice in the lantern. So I opened it — you cannot imagine how stealthily, stealthily — until at length a single dim ray, like the thread of the spider, shot from out the crevice and fell upon the vulture eye.

It was open — wide, wide open — and I grew furious as I gazed upon it. I saw it with perfect distinctness — all a dull blue, with a hideous veil over it that chilled the very marrow in my bones; but I could see nothing else of the old man's face or person: for I had directed the ray as if by instinct precisely upon the damned spot.

And now have I not told you that what you mistake for madness is but over-acuteness of the senses? — now, I say, there came to my ears a low, dull, quick sound, such as a watch makes when enveloped in cotton. I knew that sound well too. It was the beating of the old man's heart. It increased my fury, as the beating of a drum stimulates the soldier into courage.`

  title:'The Ice — Frankenstein',
  src:'Mary Shelley, 1818 - dominio publico - cartas de Walton',
  text:`You will rejoice to hear that no disaster has accompanied the commencement of an enterprise which you have regarded with such evil forebodings. I arrived here yesterday, and my first task is to assure my dear sister of my welfare and increasing confidence in the success of my undertaking.

I am already far north of London, and as I walk in the streets of Petersburgh, I feel a cold northern breeze play upon my cheeks, which braces my nerves and fills me with delight. Do you understand this feeling? This breeze, which has travelled from the regions towards which I am advancing, gives me a foretaste of those icy climes. Inspirited by this wind of promise, my daydreams become more fervent and vivid.

I try in vain to be persuaded that the pole is the seat of frost and desolation; it ever presents itself to my imagination as the region of beauty and delight. There, the sun is for ever visible, its broad disk just skirting the horizon and diffusing a perpetual splendour. What may not be expected in a country of eternal light?

Last Monday we were nearly surrounded by ice, which closed in the ship on all sides, scarcely leaving her the sea-room in which she floated. Our situation was somewhat dangerous, especially as we were compassed round by a very thick fog. About two o'clock the mist cleared away, and we beheld, stretched out in every direction, vast and irregular plains of ice, which seemed to have no end.

Some of my comrades groaned, and my own mind began to grow watchful with anxious thoughts, when a strange sight suddenly attracted our attention. We perceived a low carriage, fixed on a sledge and drawn by dogs, pass on towards the north, at the distance of half a mile; a being which had the shape of a man, but apparently of gigantic stature, sat in the sledge and guided the dogs. We watched the rapid progress of the traveller with our telescopes until he was lost among the distant inequalities of the ice.

This appearance excited our unqualified wonder. We were, as we believed, many hundred miles from any land; but this apparition seemed to denote that it was not, in reality, so distant as we had supposed. Shut in, however, by ice, it was impossible to follow his track, which we had observed with the greatest attention.

He sprang from the cabin window as he said this, upon the ice raft which lay close to the vessel. He was soon borne away by the waves and lost in darkness and distance.`

{
  id:'mariner', img:'navio',
  title:'The Becalmed Ship - The Ancient Mariner',
  src:'Samuel Taylor Coleridge, 1798 - dominio publico - partes II e IV',
  text:`The fair breeze blew, the white foam flew, the furrow followed free; we were the first that ever burst into that silent sea. Down dropt the breeze, the sails dropt down, it was sad as sad could be; and we did speak only to break the silence of the sea.

All in a hot and copper sky, the bloody Sun, at noon, right up above the mast did stand, no bigger than the Moon. Day after day, day after day, we stuck, nor breath nor motion; as idle as a painted ship upon a painted ocean.

Water, water, every where, and all the boards did shrink; water, water, every where, nor any drop to drink. The very deep did rot: O Christ! that ever this should be! Yea, slimy things did crawl with legs upon the slimy sea.

About, about, in reel and rout the death-fires danced at night; the water, like a witch's oils, burnt green, and blue and white. And every tongue, through utter drought, was withered at the root; we could not speak, no more than if we had been choked with soot.

Alone, alone, all, all alone, alone on a wide wide sea! And never a saint took pity on my soul in agony. The many men, so beautiful! And they all dead did lie: and a thousand thousand slimy things lived on; and so did I.

I looked upon the rotting sea, and drew my eyes away; I looked upon the rotting deck, and there the dead men lay. I looked to heaven, and tried to pray; but or ever a prayer had gusht, a wicked whisper came, and made my heart as dry as dust.

I closed my lids, and kept them close, and the balls like pulses beat; for the sky and the sea, and the sea and the sky lay like a load on my weary eye, and the dead were at my feet. An orphan's curse would drag to hell a spirit from on high; but oh! more horrible than that is the curse in a dead man's eye. Seven days, seven nights, I saw that curse, and yet I could not die.`
}
];

/* ---------- canvas ---------- */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let dpr=1,SW=0,SH=0;

/* ---------- C. DENSIDADE ---------- */
let DW=360,DH=200;
const dcv=document.createElement('canvas');
const dctx=dcv.getContext('2d',{willReadFrequently:true});
let dens=new Float32Array(1), angs=new Float32Array(1), mags=new Float32Array(1),
    soft=new Float32Array(1);
let POST=4;

function setDensitySize(w,h){
  DW=Math.max(24,Math.round(w)); DH=Math.max(24,Math.round(h));
  dcv.width=DW; dcv.height=DH;
  dens=new Float32Array(DW*DH); angs=new Float32Array(DW*DH);
  mags=new Float32Array(DW*DH); soft=new Float32Array(DW*DH);
}

function buildDensity(im,invert){
  const LONG=520;
  const s=LONG/Math.max(im.width,im.height);
  setDensitySize(im.width*s, im.height*s);
  dctx.setTransform(1,0,0,1,0,0);
  dctx.fillStyle='#fff'; dctx.fillRect(0,0,DW,DH);
  dctx.filter='blur(1.4px)';
  dctx.drawImage(im,0,0,DW,DH);
  dctx.filter='none';

  const d=dctx.getImageData(0,0,DW,DH).data;
  for(let i=0;i<DW*DH;i++){
    let l=(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2])/255;
    dens[i]=invert?1-l:l;
  }
  // campo suave, pré-posterização: é dele que sai a direção do fluxo.
  // Sobre a imagem posterizada o gradiente só existe nos degraus e as
  // fitas da micrografia não teriam para onde correr no meio das massas.
  soft.set(dens);
  for(let pass=0;pass<2;pass++){
    const t=Float32Array.from(soft);
    for(let y=1;y<DH-1;y++)for(let x=1;x<DW-1;x++){
      const i=y*DW+x;
      soft[i]=(t[i]*4+t[i-1]+t[i+1]+t[i-DW]+t[i+DW])/8;
    }
  }
  // posterização: colapsa o meio-tom em degraus. É o que impede
  // que ilustração realista vire chuvisco uniforme de letras.
  if(POST>1){ const n=POST-1; for(let i=0;i<dens.length;i++) dens[i]=Math.round(dens[i]*n)/n; }
  // Sobel duplo: direção da isolinha vem do campo suave (fluxo contínuo),
  // força da borda vem do campo posterizado (degrau nítido). A primeira
  // gira as letras e guia as fitas; a segunda atrai letras para o contorno.
  for(let y=1;y<DH-1;y++)for(let x=1;x<DW-1;x++){
    const i=y*DW+x;
    const sx=soft[i-DW+1]+2*soft[i+1]+soft[i+DW+1]-soft[i-DW-1]-2*soft[i-1]-soft[i+DW-1];
    const sy=soft[i+DW-1]+2*soft[i+DW]+soft[i+DW+1]-soft[i-DW-1]-2*soft[i-DW]-soft[i-DW+1];
    angs[i]=Math.atan2(sx,-sy);
    const gx=dens[i-DW+1]+2*dens[i+1]+dens[i+DW+1]-dens[i-DW-1]-2*dens[i-1]-dens[i+DW-1];
    const gy=dens[i+DW-1]+2*dens[i+DW]+dens[i+DW+1]-dens[i-DW-1]-2*dens[i-DW]-dens[i-DW+1];
    mags[i]=Math.min(1,Math.sqrt(gx*gx+gy*gy)/3.2);
  }
}
const dAt=(x,y)=>(x<0||y<0||x>=DW||y>=DH)?0:dens[(Math.round(y)*DW+Math.round(x))|0];
const aAt=(x,y)=>(x<0||y<0||x>=DW||y>=DH)?0:angs[(Math.round(y)*DW+Math.round(x))|0];

/* ---------- B. LAYOUT ---------- */
const meas=document.createElement('canvas').getContext('2d');
/* Medida da linha. Numa tela larga o texto inteiro numa coluna só dá ~190
   caracteres por linha; leitura confortável fica entre 45 e 75. Estreitar a
   coluna sozinho não resolve, porque o corpo encolhe para caber a mesma
   massa de texto e a medida quase não muda. Duas colunas cortam a medida
   pela metade mantendo o corpo — e devolvem a peça ao formato de página
   dupla de livro, que era a ideia original. */
function layout(text,colW,boxH,nc){
  const paras=text.trim().split(/\n\s*\n/);
  for(let size=30;size>=6;size-=0.5){
    meas.font=size+'px '+FONT;
    const lh=size*1.9, lines=[];
    for(const p of paras){
      const words=p.replace(/\s+/g,' ').trim().split(' ');
      let cur='';
      for(const w of words){
        const t=cur?cur+' '+w:w;
        if(meas.measureText(t).width>colW && cur){ lines.push(cur); cur=w; } else cur=t;
      }
      if(cur)lines.push(cur);
      lines.push('');
    }
    lines.pop();
    const perCol=Math.ceil(lines.length/nc);
    if(perCol*lh<=boxH) return {size,lh,lines,perCol,nc};
  }
  return null;
}
function glyphsFrom(lay,x0,y0,colW,gut){
  meas.font=lay.size+'px '+FONT;
  const out=[]; let para=0;
  lay.lines.forEach((line,li)=>{
    const col=Math.min(lay.nc-1,Math.floor(li/lay.perCol));
    const row=li-col*lay.perCol;
    if(!line.trim()){ para++; return; }   // linha em branco separa parágrafos
    let pen=x0+col*(colW+gut);
    const y=y0+row*lay.lh;
    for(const ch of line){
      const w=meas.measureText(ch).width;
      if(ch!==' ') out.push({ch,tx:pen+w/2,ty:y-lay.size*0.30,line:row,col,para});
      pen+=w;
    }
  });
  return out;
}

/* ---------- F. ATLAS ---------- */
const ROT=24;
let atlas=null;
function buildAtlas(chars,size){
  const TS=Math.ceil(size*2.0*dpr), cols=24;
  const rows=Math.ceil(chars.length*ROT/cols);
  const a=document.createElement('canvas'); a.width=cols*TS; a.height=rows*TS;
  const g=a.getContext('2d',{willReadFrequently:true});
  g.textAlign='center'; g.textBaseline='middle';
  g.font=(size*dpr)+'px '+FONT; g.fillStyle='#f0e6d2';
  const idx={},ink={},axis={},aniso={}; let k=0;
  chars.forEach(ch=>{
    idx[ch]=k;
    for(let r=0;r<ROT;r++){
      const cx=(k%cols)*TS+TS/2, cy=Math.floor(k/cols)*TS+TS/2;
      g.save(); g.translate(cx,cy); g.rotate(r/ROT*Math.PI*2); g.fillText(ch,0,0); g.restore();
      k++;
    }
  });
  // Momentos de segunda ordem sobre o glifo sem rotação:
  //   ink   = densidade de tinta   (eixo tonal, à la ASCII clássico)
  //   axis  = ângulo do eixo principal do traço
  //   aniso = quão alongado ele é  (0 = redondo, 1 = risco)
  // axis e aniso são o eixo estrutural — a ideia do paper de 2010 e o
  // que o Cook faz à mão ao usar parêntese para curva e @ para sombra.
  chars.forEach(ch=>{
    const t=idx[ch], sx=(t%cols)*TS, sy=Math.floor(t/cols)*TS;
    const d=g.getImageData(sx,sy,TS,TS).data;
    let s=0,mx=0,my=0;
    for(let y=0;y<TS;y++)for(let x=0;x<TS;x++){
      const al=d[(y*TS+x)*4+3]; if(!al) continue;
      s+=al; mx+=x*al; my+=y*al;
    }
    ink[ch]=s/(TS*TS*255);
    if(s<=0){ axis[ch]=0; aniso[ch]=0; return; }
    mx/=s; my/=s;
    let xx=0,yy=0,xy=0;
    for(let y=0;y<TS;y++)for(let x=0;x<TS;x++){
      const al=d[(y*TS+x)*4+3]; if(!al) continue;
      const dx=x-mx, dy=y-my;
      xx+=al*dx*dx; yy+=al*dy*dy; xy+=al*dx*dy;
    }
    xx/=s; yy/=s; xy/=s;
    axis[ch]=0.5*Math.atan2(2*xy, xx-yy);
    const tr=xx+yy, det=xx*yy-xy*xy;
    const disc=Math.sqrt(Math.max(0,tr*tr/4-det));
    const l1=tr/2+disc, l2=Math.max(0,tr/2-disc);
    aniso[ch]=l1>1e-6 ? Math.min(1,1-l2/l1) : 0;
    if(!Number.isFinite(axis[ch])) axis[ch]=0;
    if(!Number.isFinite(aniso[ch])) aniso[ch]=0;
  });
  return {canvas:a,TS,cols,idx,ink,axis,aniso};
}

/* ---------- D. AMOSTRAGEM + PAREAMENTO ---------- */
let G=[], fit={s:1,ox:0,oy:0};
let mouse={x:-9999,y:-9999,in:false};

/* Grão: no estado de desenho a letra encolhe e se multiplica em satélites.
   Encolher sozinho afina o traço mas clareia o desenho (área cai com o
   quadrado da escala); multiplicar repõe a densidade. Juntos dão mais
   marcas menores — que é o que produz nitidez. Os satélites existem só
   no desenho: ao ler, convergem para a letra-mãe e desaparecem. */
/* sc = escala da letra no desenho · mult = satélites · ab = compensação
   de alfa. A cobertura vale mult × sc², então reduzir sem multiplicar
   clareia o desenho. Os presets mantêm a cobertura ~constante até onde
   dá; nos dois últimos ela cai e o alfa compensa. */
const GRAINS=[
  {l:'grão: grosso',    sc:1.00, mult:1,  ab:1.00},
  {l:'grão: médio',     sc:0.72, mult:2,  ab:1.00},
  {l:'grão: fino',      sc:0.52, mult:3,  ab:1.00},
  {l:'grão: muito fino',sc:0.38, mult:6,  ab:1.05},
  {l:'grão: micro',     sc:0.28, mult:10, ab:1.18},
  {l:'grão: pó',        sc:0.20, mult:12, ab:1.45}
];
let grainIx=2;
let DSC=GRAINS[grainIx].sc, MULT=GRAINS[grainIx].mult, AB=GRAINS[grainIx].ab;
let micro=false;   // false = mancha (pontos independentes) · true = micrografia
let NCOL=2;        // colunas de texto

/* No toque não existe hover, e o dedo cobre justamente a linha que se quer
   ler. Então a lente deixa de seguir o cursor e passa a ser um cursor de
   leitura: cada toque avança um parágrafo, que fica aceso sozinho até o
   toque seguinte. Depois do último, volta ao desenho. */
const isTouch = matchMedia('(hover: none)').matches;
let readPara = -1;   // -1 = só o desenho
const EDGE=1.15;   // peso da atração de borda na amostragem

/* Amostragem por melhor-candidato sobre uma CDF de densidade+borda.
   Rejeição pura agrupa e deixa buracos; escolher, entre K candidatos, o
   mais distante dos já colocados aproxima ruído azul e limpa o desenho. */
function sampleTargets(N){
  const n=DW*DH;
  const cum=new Float32Array(n);
  let acc=0;
  for(let i=0;i<n;i++){
    const d=dens[i];
    acc += (d>0.03 ? d : 0) + EDGE*mags[i];
    cum[i]=acc;
  }
  if(acc<=0) return [];
  const pick=()=>{
    const r=Math.random()*acc;
    let lo=0,hi=n-1;
    while(lo<hi){ const m=(lo+hi)>>1; if(cum[m]<r) lo=m+1; else hi=m; }
    return lo;
  };
  const cell=Math.max(1.2, Math.sqrt(DW*DH/N)*0.85);
  const gw=Math.ceil(DW/cell), gh=Math.ceil(DH/cell);
  const grid=new Array(gw*gh);
  const out=[];
  const K=5;
  for(let k=0;k<N;k++){
    let bx=0,by=0,bi=0,bd=-1;
    for(let c=0;c<K;c++){
      const i=pick();
      const x=(i%DW)+Math.random(), y=((i/DW)|0)+Math.random();
      const cx=Math.min(gw-1,(x/cell)|0), cy=Math.min(gh-1,(y/cell)|0);
      let d2=1e9;
      for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
        const ax=cx+ox, ay=cy+oy;
        if(ax<0||ay<0||ax>=gw||ay>=gh) continue;
        const arr=grid[ay*gw+ax]; if(!arr) continue;
        for(let q=0;q<arr.length;q++){
          const p=out[arr[q]];
          const dd=(p.x-x)*(p.x-x)+(p.y-y)*(p.y-y);
          if(dd<d2) d2=dd;
        }
      }
      if(d2>bd){ bd=d2; bx=x; by=y; bi=i; }
    }
    out.push({x:bx,y:by,d:dens[bi],a:angs[bi],ed:mags[bi]});
    const cx=Math.min(gw-1,(bx/cell)|0), cy=Math.min(gh-1,(by/cell)|0);
    const gi=cy*gw+cx;
    (grid[gi]||(grid[gi]=[])).push(out.length-1);
  }
  return out;
}

/* ---------- micrografia: fitas de texto ao longo do fluxo ----------
   Em vez de glifos independentes sobre uma mancha, as letras correm em
   linha pelas isolinhas do campo — que é o que escribas fazem desde o
   século IX. O contorno vira linha explícita, e as palavras continuam
   contíguas dentro de cada fita. */
function sampleRibbons(N, step){
  const n=DW*DH;
  const cum=new Float32Array(n);
  let acc=0;
  for(let i=0;i<n;i++){ acc += dens[i]>0.05 ? dens[i] : 0; cum[i]=acc; }
  if(acc<=0) return [];
  const pick=()=>{
    const r=Math.random()*acc;
    let lo=0,hi=n-1;
    while(lo<hi){ const m=(lo+hi)>>1; if(cum[m]<r) lo=m+1; else hi=m; }
    return lo;
  };
  const sep=step*1.5, sep2=sep*sep;
  const cell=Math.max(1.2,sep);
  const gw=Math.ceil(DW/cell), gh=Math.ceil(DH/cell);
  const grid=new Array(gw*gh);
  const out=[];
  const put=(p)=>{
    out.push(p);
    const gi=Math.min(gh-1,(p.y/cell)|0)*gw+Math.min(gw-1,(p.x/cell)|0);
    (grid[gi]||(grid[gi]=[])).push(p);
  };
  const near=(x,y,skip)=>{
    const cx=Math.min(gw-1,(x/cell)|0), cy=Math.min(gh-1,(y/cell)|0);
    for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
      const ax=cx+ox, ay=cy+oy;
      if(ax<0||ay<0||ax>=gw||ay>=gh) continue;
      const arr=grid[ay*gw+ax]; if(!arr) continue;
      for(let q=0;q<arr.length;q++){
        const p=arr[q];
        if(skip && p.rib===skip) continue;
        if((p.x-x)*(p.x-x)+(p.y-y)*(p.y-y) < sep2) return true;
      }
    }
    return false;
  };
  const at=(arr,x,y)=>{
    const xi=x<0?0:x>=DW?DW-1:x|0, yi=y<0?0:y>=DH?DH-1:y|0;
    return arr[yi*DW+xi];
  };

  let rib=0, guard=0;
  const MAXLEN=140;
  while(out.length<N && guard<N*4+900){
    guard++;
    const si=pick();
    const sxp=(si%DW)+0.5, syp=((si/DW)|0)+0.5;
    if(near(sxp,syp,0)) continue;
    rib++;
    const line=[];
    for(const dir of [1,-1]){
      let x=sxp, y=syp;
      let hx=Math.cos(at(angs,x,y))*dir, hy=Math.sin(at(angs,x,y))*dir;
      const seg=[];
      for(let s=0;s<MAXLEN;s++){
        let a=at(angs,x,y);
        let ax=Math.cos(a), ay=Math.sin(a);
        if(ax*hx+ay*hy<0){ ax=-ax; ay=-ay; }   // campo de direção, não vetorial
        hx=hx*0.55+ax*0.45; hy=hy*0.55+ay*0.45;
        const hl=Math.hypot(hx,hy)||1; hx/=hl; hy/=hl;
        x+=hx*step; y+=hy*step;
        if(x<1||y<1||x>=DW-1||y>=DH-1) break;
        if(at(dens,x,y)<0.06) break;
        if(near(x,y,rib)) break;
        seg.push({x,y,d:at(dens,x,y),a:Math.atan2(hy,hx),ed:at(mags,x,y),rib});
      }
      if(dir===1) line.push(...seg);
      else { seg.reverse(); line.unshift(...seg); }
    }
    if(line.length<5){ continue; }
    for(const p of line){ if(out.length>=N) break; put(p); }
  }
  return out;
}

function build(work){
  const nc     = (SW/SH>1.25) ? NCOL : 1;      // uma coluna em tela estreita
  const blockW = SW*0.72;
  const gut    = nc>1 ? SW*0.05 : 0;
  const colW   = (blockW-gut*(nc-1))/nc;
  const padY   = SH*0.13;
  const x0     = (SW-blockW)/2;

  const lay=layout(work.text, colW, SH-padY*2, nc);
  if(!lay) return;
  G=glyphsFrom(lay,x0,padY+lay.size,colW,gut);
  const N=G.length;

  // geometria da página, usada pela lente para escolher linha e coluna
  const l2p=new Int32Array(lay.lines.length); let pp=0;
  lay.lines.forEach((l,i)=>{ if(!l.trim()) pp++; l2p[i]=pp; });
  LAY={y0:padY+lay.size, lh:lay.lh, perCol:lay.perCol, nc, x0, colW, gut, l2p};

  // caixa de cada parágrafo, para o cursor de leitura do toque
  const PB={};
  for(const g of G){
    let q=PB[g.para]; if(!q) q=PB[g.para]={t:1e9,b:-1e9,l:1e9,r:-1e9};
    if(g.ty<q.t)q.t=g.ty; if(g.ty>q.b)q.b=g.ty;
    if(g.tx<q.l)q.l=g.tx; if(g.tx>q.r)q.r=g.tx;
  }
  LAY.para=PB;
  LAY.paras=Object.keys(PB).map(Number).sort((a,b)=>a-b);
  if(readPara>=0 && LAY.paras.indexOf(readPara)<0) readPara=-1;

  atlas=buildAtlas([...new Set(G.map(g=>g.ch))], lay.size);

  // tela cheia: a arte ocupa a maior área possível sem cortar
  const s=Math.min(SW/DW,SH/DH);
  fit={s, ox:(SW-DW*s)/2, oy:(SH-DH*s)/2};

  for(let k=0;k<N;k++){ G[k].pos=[]; G[k].r=0; G[k].sp=0.72+Math.random()*0.7; }

  // dois eixos de ordenação dos glifos:
  //   tonal      — mais tinta primeiro (preenchimento)
  //   estrutural — mais alongado primeiro (contorno)
  const byInk =G.map((g,i)=>i).sort((i,j)=>atlas.ink[G[j].ch]-atlas.ink[G[i].ch]);
  const byAxis=G.map((g,i)=>i).sort((i,j)=>atlas.aniso[G[j].ch]-atlas.aniso[G[i].ch]);

  const place=(t,gi,contour)=>{
    G[gi].pos.push({dx:fit.ox+t.x*fit.s, dy:fit.oy+t.y*fit.s,
                    da:t.a, dk:t.d, de:t.ed||0, ct:contour?1:0});
  };
  let marks=0;

  if(micro){
    // micrografia: uma fita por letra, na ordem do texto. Cada letra fica
    // onde o percurso a colocou, então as palavras seguem contíguas.
    const step=Math.max(0.6,(lay.size*0.52*DSC)/fit.s);
    const rib=sampleRibbons(N,step);
    if(!rib.length) return;
    for(let k=0;k<rib.length && k<N;k++) place(rib[k],k,true);
    marks=Math.min(rib.length,N);
  }else{
    const targets=sampleTargets(N*MULT);
    if(!targets.length) return;
    marks=targets.length;

    // FITA NOVA: as N marcas de borda mais forte viram a passada de
    // contorno, e recebem os glifos mais alongados, girados para o traço
    // deles acompanhar a isolinha.
    targets.sort((p,q)=>q.ed-p.ed);
    const bold=targets.slice(0,N);
    const mass=targets.slice(N);
    bold.sort((p,q)=>q.d-p.d);
    for(let k=0;k<bold.length;k++) place(bold[k],byAxis[k],true);

    // FITA SECA: o resto é massa, fraca e ampla, pareada por tom.
    for(let layer=0;layer<MULT-1;layer++){
      const slice=mass.slice(layer*N,(layer+1)*N);
      slice.sort((p,q)=>q.d-p.d);
      for(let k=0;k<slice.length;k++) place(slice[k],byInk[k],false);
    }
  }

  /* Orçamento de contorno.
     A passada de contorno tem N marcas — uma por letra — e cada uma cobre
     cerca de um avanço de glifo. Isso é um comprimento fixo de traço
     disponível. Do outro lado, a imagem tem um comprimento de contorno que
     é o que ela precisa para fechar. Se a razão cai abaixo de 100%, a linha
     não fecha e o desenho vira poeira, por mais marcas que existam na massa.
     É a métrica que separa a baleia do mago em close. */
  let epx=0;
  for(let i=0;i<mags.length;i++) if(mags[i]>0.30) epx++;
  // 4.0 = largura estimada da banda de borda depois do desfoque. Calibrado
  // contra casos reais: com 2.6 a conta inflava o contorno e marcava vermelho
  // em imagens que fechavam bem.
  const edgeLen=(epx/4.0)*fit.s;                 // traço da imagem, em px de tela
  const budget =N*(lay.size*0.52*DSC);           // traço disponível, em px de tela
  const cover  =edgeLen>1 ? budget/edgeLen : 99;
  const pct=Math.round(cover*100);

  document.getElementById('mTitle').textContent=work.title;
  document.getElementById('mSrc').textContent=work.src;
  // medida: caracteres por linha, o número que decide se dá para ler
  let cpl=0, nl=0;
  lay.lines.forEach(l=>{ if(l.trim()){ cpl+=l.length; nl++; } });
  cpl=nl?Math.round(cpl/nl):0;

  const st=document.getElementById('stats');
  st.textContent=
    N.toLocaleString('pt-BR')+' letras · '+marks.toLocaleString('pt-BR')+' marcas · corpo '
    +lay.size.toFixed(1)+'px · medida '+cpl+' car/linha · contorno '
    +(pct>400?'>400':pct)+'% coberto'+(cover<0.65?' — curto':'');
  st.style.color = cover<0.65 ? '#b4553f' : cover<1.1 ? '#7d7263' : '#5f7d4f';
}

/* ---------- E. LENTE + loop ---------- */
/* A lente escolhe a LINHA, não um ponto. Revelar só um trecho horizontal
   obriga a arrastar o mouse acompanhando a frase, o que impede leitura.
   Apontar a altura e receber a linha inteira de ponta a ponta deixa a
   leitura vertical, que é como se lê uma página. */
const LENS=[
  {name:'lente: linha',     kind:'line', in:0.6, out:1.6, band:2.0},
  {name:'lente: 3 linhas',  kind:'line', in:1.6, out:2.8, band:3.4},
  {name:'lente: parágrafo', kind:'para', band:4.5},
  {name:'lente: ponto',     kind:'spot', rx:0.075, ry:0.018}
];
let lensIx=0, pageMode=false, holeOn=true, lastT=performance.now();
let LAY=null;
const ss=t=>t*t*(3-2*t);

function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0a0908'; ctx.fillRect(0,0,SW,SH);

  if(!atlas||!LAY){ requestAnimationFrame(frame); return; }
  const L=LENS[lensIx];
  const RX=SW*(L.rx||0.1), RY=SH*(L.ry||0.03);
  const HR=SW*0.15, HR2=HR*HR;           // raio do recorte, só na lente ponto
  const TS=atlas.TS, cols=atlas.cols, TSl=TS/dpr;

  // qual coluna, linha e parágrafo o cursor está apontando
  const cCol  =LAY.nc<2 ? 0 : Math.max(0,Math.min(LAY.nc-1,
                Math.floor((mouse.x-LAY.x0+LAY.gut*0.5)/(LAY.colW+LAY.gut))));
  const cLineF=(mouse.y-LAY.y0)/LAY.lh;
  const cLineI=Math.max(0,Math.min(LAY.perCol-1,Math.round(cLineF)));
  const cPara =LAY.l2p[Math.min(LAY.l2p.length-1,cCol*LAY.perCol+cLineI)];
  const bandY =LAY.y0+cLineI*LAY.lh;
  const bandH =LAY.lh*(L.band||2);
  // a faixa de leitura se limita à coluna apontada; o parágrafo pode
  // atravessar a virada de coluna, então abre nas duas
  const bandX =L.kind==='para' ? LAY.x0-LAY.gut*0.4 : LAY.x0+cCol*(LAY.colW+LAY.gut)-LAY.gut*0.4;
  const bandW =L.kind==='para' ? LAY.colW*LAY.nc+LAY.gut*(LAY.nc-1)+LAY.gut*0.8
                               : LAY.colW+LAY.gut*0.8;

  // no toque a faixa envolve o parágrafo escolhido, não a altura do dedo
  let bY=bandY, bH=bandH, bX=bandX, bW=bandW, cP=cPara;
  if(isTouch){
    cP=readPara;
    const q=LAY.para&&LAY.para[readPara];
    if(q){ bY=(q.t+q.b)/2; bH=(q.b-q.t)/2+LAY.lh*1.3; bX=q.l-LAY.lh; bW=q.r-q.l+LAY.lh*2; }
    else { bY=-1e5; bH=0; bX=0; bW=0; }
  }
  const lensOn = isTouch ? readPara>=0 : mouse.in;

  if(lensOn&&!pageMode){
    if(L.kind==='spot'&&!isTouch){
      const gr=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,RX*1.15);
      gr.addColorStop(0,'rgba(200,160,74,.10)'); gr.addColorStop(1,'rgba(200,160,74,0)');
      ctx.save(); ctx.translate(mouse.x,mouse.y); ctx.scale(1,Math.max(.18,L.ry/L.rx*3.1));
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(0,0,RX*1.15,0,7); ctx.fill(); ctx.restore();
    }else{
      const gr=ctx.createLinearGradient(0,bY-bH,0,bY+bH);
      gr.addColorStop(0,'rgba(200,160,74,0)');
      gr.addColorStop(.5,'rgba(200,160,74,.085)');
      gr.addColorStop(1,'rgba(200,160,74,0)');
      ctx.fillStyle=gr; ctx.fillRect(bX,bY-bH,bW,bH*2);
    }
  }

  for(let i=0;i<G.length;i++){
    const g=G[i];
    if(!g.pos) continue;
    // a lente mede sempre a posição do glifo NA PÁGINA, nunca no desenho
    let want=0;
    if(pageMode) want=1;
    else if(isTouch){ want=g.para===cP?1:0; }
    else if(mouse.in){
      if(L.kind==='spot'){
        const dx=(mouse.x-g.tx)/RX, dy=(mouse.y-g.ty)/RY;
        const d=Math.sqrt(dx*dx+dy*dy);
        want=d>=1?0:ss(Math.min(1,(1-d)/0.62));
      }else if(L.kind==='para'){
        want=g.para===cPara?1:0;
      }else if(g.col===cCol){
        const d=Math.abs(g.line-cLineF);
        want=d>=L.out?0:ss(Math.min(1,(L.out-d)/(L.out-L.in)));
      }
    }
    g.r+=(want-g.r)*(1-Math.exp(-9*g.sp*dt));
    if(g.r<0.0015&&want===0) g.r=0;

    const e=ss(g.r);
    const arc=Math.sin(e*Math.PI)*SH*0.018;
    const sc=DSC+(1-DSC)*e;          // encolhida no desenho, cheia na página
    const sz=TSl*sc, half=sz/2;
    const base=atlas.idx[g.ch];

    for(let p=0;p<g.pos.length;p++){
      if(p>0 && e>0.985) break;      // satélites só existem no desenho
      const P=g.pos[p];
      const x=P.dx+(g.tx-P.dx)*e;
      const y=P.dy+(g.ty-P.dy)*e-arc;
      // fita nova (contorno) crava; fita seca (massa) só sugere
      const draw = P.ct
        ? Math.min(1,(0.30+P.dk*0.40+P.de*0.75)*AB)
        : Math.min(1,(0.10+P.dk*0.52)*AB*0.62);
      let alpha=draw*(1-e)+e;
      if(p>0) alpha*=(1-e)*(1-e);

      // recorte: limpa o desenho atrás do que está sendo lido. Com a lente
      // de linha vira uma faixa que atravessa a tela, para a frase inteira
      // ter fundo livre de ponta a ponta.
      if(holeOn&&lensOn&&!pageMode&&e<0.9){
        if(L.kind==='spot'&&!isTouch){
          const ddx=x-mouse.x, ddy=y-mouse.y, q=(ddx*ddx+ddy*ddy)/HR2;
          if(q<1) alpha*=1-0.82*ss(1-Math.sqrt(q))*(1-e);
        }else if(bH>0){
          const dy=Math.abs(y-bY);
          if(dy<bH && x>bX && x<bX+bW)
            alpha*=1-0.86*ss(1-dy/bH)*(1-e);
        }
      }
      if(alpha<0.012) continue;

      // na micrografia a letra fica de pé em relação à fita (leitura);
      // na passada de contorno ela gira para o próprio traço acompanhar
      // a isolinha — daí descontar o eixo principal do glifo.
      const aim=micro ? P.da : (P.ct ? P.da-atlas.axis[g.ch] : P.da);
      let ri=Math.round(aim*(1-e)/(Math.PI*2)*ROT)%ROT; if(ri<0) ri+=ROT;
      const t=base+ri;
      ctx.globalAlpha=alpha;
      ctx.drawImage(atlas.canvas,(t%cols)*TS,Math.floor(t/cols)*TS,TS,TS,x-half,y-half,sz,sz);
    }
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}

/* ---------- estado / eventos ---------- */
const IMGS={};
let workIx=0, upImg=null;

function refresh(){
  const w=WORKS[workIx];
  const im=upImg||IMGS[w.img];
  if(!im) return;
  buildDensity(im,true);
  build(w);
}
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  SW=innerWidth; SH=innerHeight;
  cv.width=Math.round(SW*dpr); cv.height=Math.round(SH*dpr);
  // sem isto o navegador reduz o glifo do atlas com bilinear de 2×2 texels
  // e perde energia justamente nos grãos pequenos
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  refresh();
}
addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(resize,180)});

const stage=document.getElementById('stage');
stage.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.in=true});
stage.addEventListener('pointerleave',()=>mouse.in=false);
stage.addEventListener('pointerdown',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.in=true});

const hintEl=document.getElementById('hint');
function stepPara(dir){
  if(!LAY||!LAY.paras.length) return;
  const i=LAY.paras.indexOf(readPara);
  let n=i+(dir||1);
  readPara = (n<0||n>=LAY.paras.length) ? -1 : LAY.paras[n];
  hintEl.textContent = readPara<0
    ? 'toque para ler'
    : (LAY.paras.indexOf(readPara)+1)+' de '+LAY.paras.length+' · toque para seguir';
}
if(isTouch){
  stage.addEventListener('pointerup',e=>{
    if(e.target.closest('button')) return;
    // terço esquerdo volta, resto avança
    stepPara(e.clientX < SW*0.25 ? -1 : 1);
  });
}

const bPage=document.getElementById('bPage');
bPage.onclick=()=>{pageMode=!pageMode;bPage.classList.toggle('on',pageMode);
  bPage.textContent=pageMode?'ver o desenho':'ver a página'};

const bLens=document.getElementById('bLens');
bLens.onclick=()=>{lensIx=(lensIx+1)%LENS.length;bLens.textContent=LENS[lensIx].name};

const bHole=document.getElementById('bHole');
bHole.onclick=()=>{holeOn=!holeOn;bHole.classList.toggle('on',holeOn);
  bHole.textContent='recorte: '+(holeOn?'on':'off')};

document.getElementById('bWork').onclick=()=>{workIx=(workIx+1)%WORKS.length;upImg=null;refresh()};

const bCols=document.getElementById('bCols');
bCols.onclick=()=>{
  NCOL=NCOL===2?1:2;
  bCols.textContent='colunas: '+NCOL;
  bCols.classList.toggle('on',NCOL===2);
  refresh();
};

const bMode=document.getElementById('bMode');
bMode.onclick=()=>{
  micro=!micro;
  bMode.classList.toggle('on',micro);
  bMode.textContent='modo: '+(micro?'micrografia':'mancha');
  refresh();
};

const bGrain=document.getElementById('bGrain');
bGrain.onclick=()=>{
  grainIx=(grainIx+1)%GRAINS.length;
  DSC=GRAINS[grainIx].sc; MULT=GRAINS[grainIx].mult; AB=GRAINS[grainIx].ab;
  bGrain.textContent=GRAINS[grainIx].l;
  bGrain.classList.toggle('on',grainIx>0);
  refresh();
};

const POSTS=[{n:4,l:'tons: 4'},{n:6,l:'tons: 6'},{n:3,l:'tons: 3'},{n:0,l:'tons: livre'}];
let postIx=0;
const bPost=document.getElementById('bPost');
bPost.classList.add('on');
bPost.onclick=()=>{postIx=(postIx+1)%POSTS.length;POST=POSTS[postIx].n;
  bPost.textContent=POSTS[postIx].l;bPost.classList.toggle('on',POST>0);refresh()};

document.getElementById('bImg').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const im=new Image();
  im.onload=()=>{upImg=im;refresh()};
  im.src=URL.createObjectURL(f);
};
addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();bPage.click()}
  if(e.key==='ArrowRight'){document.getElementById('bWork').click()}
});

/* ---------- boot ---------- */
Promise.all(Object.keys(SRC).map(k=>new Promise(res=>{
  const i=new Image();
  i.onload=()=>{IMGS[k]=i;res()};
  i.onerror=()=>res();
  i.src=SRC[k];
}))).then(()=>{
  const b=document.getElementById('boot');
  if(isTouch){
    // trava o grão: celular não aguenta 18 mil drawImage por quadro
    grainIx=1; DSC=GRAINS[1].sc; MULT=GRAINS[1].mult; AB=GRAINS[1].ab;
    bGrain.textContent=GRAINS[1].l;
    lensIx=2;                          // lente de parágrafo
    bLens.textContent=LENS[2].name;
    hintEl.textContent='toque para ler';
    document.getElementById('bMode').style.display='none';
  }
  resize();
  requestAnimationFrame(frame);
  b.style.opacity=0; setTimeout(()=>b.remove(),600);
});
</script>
